{% extends "base.html" %}
{% block title %}国际机票情报{% endblock %}
{% block content %}
<div class="page-head"><h1>国际机票情报</h1></div>
<div class="card warn-box">
  <strong>情报模式：</strong>{{ note }}。不代购；报道价≠可买价。
</div>

<section class="card" id="channel-tabs">
  <div class="tabs">
    <button type="button" class="tab active" data-ch="my_origin">我的出发地</button>
    <button type="button" class="tab" data-ch="china_mainland">全国出发</button>
    <button type="button" class="tab" data-ch="hk_mo">香港／澳门</button>
    <button type="button" class="tab" data-ch="global_error">全球错价</button>
  </div>
</section>

<section class="card" id="origin-panel" hidden>
  <h2>出发地筛选 <span class="muted" id="ch-label"></span></h2>
  <div class="origin-row" id="origin-chips"></div>
  <div class="origin-row" style="margin-top:10px">
    <label class="chip strong"><input type="checkbox" id="nationwide"> 全国出发（仅内地）</label>
    <label class="chip hk"><input type="checkbox" id="hkg"> 香港 HKG</label>
    <label class="chip mo"><input type="checkbox" id="mfm"> 澳门 MFM</label>
  </div>
  <div class="origin-row" style="margin-top:10px">
    <button type="button" id="btn-apply" class="btn">应用</button>
    <button type="button" id="btn-reset" class="btn">默认 CKG/TFU/CTU</button>
    <label class="chip"><input type="checkbox" id="hide_expired" checked> 隐藏过期</label>
    <span id="origin-status" class="muted"></span>
  </div>
  <div class="origin-row" style="margin-top:10px">
    <label class="chip">目的地
      <input type="text" id="f-dest" placeholder="IATA 或城市" style="width:7em;border:1px solid #ccc;border-radius:4px;padding:4px 6px" />
    </label>
    <label class="chip">类别
      <select id="f-cat" style="border:1px solid #ccc;border-radius:4px;padding:4px 6px">
        <option value="">全部</option>
        <option value="suspected_bug_fare">疑似错价</option>
        <option value="fuel_anomaly">漏油</option>
        <option value="official_or_flash_promo">官方/限时促销</option>
        <option value="community_deal_tip">社区爆料</option>
        <option value="mileage_promo">里程促销</option>
        <option value="other_intl_deal">其他国际优惠</option>
      </select>
    </label>
    <label class="chip">发布/发现起
      <input type="date" id="f-from" style="border:1px solid #ccc;border-radius:4px;padding:3px 6px" />
    </label>
    <label class="chip">止
      <input type="date" id="f-to" style="border:1px solid #ccc;border-radius:4px;padding:3px 6px" />
    </label>
    <label class="chip">反馈
      <select id="f-fb" style="border:1px solid #ccc;border-radius:4px;padding:4px 6px">
        <option value="">全部</option>
        <option value="bookmarked">已收藏</option>
        <option value="useful">有用</option>
        <option value="ignore">忽略</option>
      </select>
    </label>
  </div>
</section>

<section class="card">
  <h2>情报 <span class="muted" id="intel-count"></span></h2>
  <div id="intel-empty" class="muted" hidden>当前频道暂无匹配情报。</div>
  <div id="intel-list"></div>
  <div id="folded-wrap" hidden>
    <h3 style="margin-top:20px">可能适用我的城市（全国/待核实）</h3>
    <div id="folded-list" class="muted-box"></div>
  </div>
</section>

<style>
.tabs { display:flex; flex-wrap:wrap; gap:8px; }
.tab { padding:8px 14px; border:1px solid #ccc; border-radius:6px; background:#fff; cursor:pointer; font-size:14px; }
.tab.active { background:#1a56db; color:#fff; border-color:#1a56db; }
.origin-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.chip { display:inline-flex; align-items:center; gap:4px; padding:6px 10px; border:1px solid #ccc; border-radius:16px; font-size:14px; cursor:pointer; background:#fff; }
.chip.strong { background:#e8f4ff; border-color:#4a90d9; }
.chip.hk { background:#fff4e6; border-color:#d98a2b; }
.chip.mo { background:#f3e8ff; border-color:#8b5cf6; }
.btn { padding:8px 14px; border:1px solid #333; border-radius:6px; background:#f5f5f5; cursor:pointer; }
.intel-item { border-bottom:1px solid #eee; padding:12px 0; }
.intel-item h3 { margin:0 0 6px; font-size:15px; }
.intel-meta { font-size:13px; color:#555; display:flex; flex-wrap:wrap; gap:10px; }
.badge-cat { display:inline-block; padding:2px 8px; border-radius:4px; font-size:12px; background:#eee; }
.badge-cat.bug { background:#ffe0e0; }
.badge-cat.fuel { background:#fff0d0; }
.badge-cat.official { background:#e0f5e0; }
.muted-box { opacity:0.85; margin-top:8px; }
@media (max-width:640px) {
  .tab { font-size:13px; padding:6px 10px; flex:1 1 45%; }
}
</style>

<script>
(function () {
  const STORAGE_KEY = "fh_fare_channels_v1";
  const CHIPS = [
    ["CKG","重庆"],["TFU","成都 TFU"],["CTU","成都 CTU"],["PEK","北京"],
    ["PVG","上海 PVG"],["SHA","上海 SHA"],["CAN","广州"],["SZX","深圳"],
    ["HGH","杭州"],["WUH","武汉"],["KMG","昆明"]
  ];
  let state = {
    channel: "my_origin",
    codes: ["CKG","TFU","CTU"],
    nationwide: false,
    hkg: false,
    mfm: false,
    hide_expired: true,
    dest: "",
    cat: "",
    date_from: "",
    date_to: "",
    fb: "",
  };
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = Object.assign(state, JSON.parse(raw));
  } catch (e) {}

  function $(id) { return document.getElementById(id); }
  function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }

  function renderChips() {
    const box = $("origin-chips");
    box.innerHTML = "";
    const set = new Set(state.codes || []);
    CHIPS.forEach(([code, label]) => {
      const lab = document.createElement("label");
      lab.className = "chip";
      lab.innerHTML = '<input type="checkbox" value="' + code + '"' + (set.has(code) ? " checked" : "") + "> " + label;
      box.appendChild(lab);
    });
    $("nationwide").checked = !!state.nationwide;
    $("hkg").checked = !!state.hkg;
    $("mfm").checked = !!state.mfm;
    $("hide_expired").checked = state.hide_expired !== false;
    if ($("f-dest")) $("f-dest").value = state.dest || "";
    if ($("f-cat")) $("f-cat").value = state.cat || "";
    if ($("f-from")) $("f-from").value = state.date_from || "";
    if ($("f-to")) $("f-to").value = state.date_to || "";
    if ($("f-fb")) $("f-fb").value = state.fb || "";
  }

  function readUI() {
    state.codes = [...document.querySelectorAll("#origin-chips input:checked")].map((c) => c.value);
    state.nationwide = $("nationwide").checked;
    state.hkg = $("hkg").checked;
    state.mfm = $("mfm").checked;
    state.hide_expired = $("hide_expired").checked;
    state.dest = ($("f-dest").value || "").trim();
    state.cat = $("f-cat").value || "";
    state.date_from = $("f-from").value || "";
    state.date_to = $("f-to").value || "";
    state.fb = $("f-fb").value || "";
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function safeHttpUrl(u) {
    try {
      const x = new URL(String(u), location.origin);
      if (x.protocol === "http:" || x.protocol === "https:") return x.href;
    } catch (e) {}
    return null;
  }
  function catBadge(cat, isErr) {
    if (isErr) return '<span class="badge-cat bug">全球错价/异常</span>';
    const map = {
      suspected_bug_fare: ["疑似错价","bug"],
      fuel_anomaly: ["漏油/燃油异常","fuel"],
      official_or_flash_promo: ["官方/限时促销","official"],
      community_deal_tip: ["社区爆料",""],
      mileage_promo: ["里程促销",""],
      hidden_city: ["甩尾风险","bug"],
      other_intl_deal: ["其他国际优惠",""],
    };
    const [label, cls] = map[cat] || [cat || "情报",""];
    return '<span class="badge-cat ' + esc(cls) + '">' + esc(label) + "</span>";
  }

  function card(it) {
    const el = document.createElement("article");
    el.className = "intel-item";
    const urls = (it.source_urls && it.source_urls.length ? it.source_urls : [it.source_url])
      .filter(Boolean);
    const linkHtml = urls.map((u) => {
      const safe = safeHttpUrl(u);
      return safe
        ? '<a href="' + esc(safe) + '" target="_blank" rel="noopener noreferrer">原文</a>'
        : "";
    }).filter(Boolean).join(" ");
    const route = (it.origin_airport || "多城/未知") + " → " + (it.destination_airport || "多目的地");
    const timeLabel = it.published_at
      ? ("发布 " + it.published_at)
      : ("发现 " + (it.found_at || "时间未知") + (it.published_at ? "" : "（发布时间未知）"));
    el.innerHTML =
      "<h3>" + catBadge(it.category, it.is_error_fare) + " " + esc(it.title || "") + "</h3>" +
      '<div class="intel-meta">' +
      "<span>" + esc(route) + "</span>" +
      (it.city_match_level ? "<span>适用性:" + esc(it.city_match_level) + "</span>" : "") +
      (it.airline ? "<span>" + esc(it.airline) + "</span>" : "") +
      (it.reported_total ? "<span>报道价 " + esc(it.reported_total) + esc(it.currency || "") + "</span>" : "") +
      "<span>" + esc(timeLabel) + "</span>" +
      "<span>" + (it.is_error_fare ? "风险:自担" : "非实时可买") + "</span>" +
      (it.signal_id ? ' <button type="button" class="btn fb" data-id="' + esc(it.signal_id) + '" data-fb="bookmarked">收藏</button>' : "") +
      "</div>" +
      '<p style="margin:6px 0;font-size:13px">' + esc(it.summary_zh || "") + "</p>" +
      '<div class="intel-links">' + linkHtml + "</div>";
    return el;
  }

  function render(data) {
    const list = $("intel-list");
    list.innerHTML = "";
    const items = (data && data.items) || [];
    const folded = (data && data.folded) || [];
    $("intel-count").textContent = items.length ? "（" + items.length + "）" : "";
    $("intel-empty").hidden = items.length > 0;
    items.forEach((it) => list.appendChild(card(it)));
    const wrap = $("folded-wrap");
    const fl = $("folded-list");
    if (folded.length && state.channel === "my_origin") {
      wrap.hidden = false;
      fl.innerHTML = "";
      folded.forEach((it) => fl.appendChild(card(it)));
    } else {
      wrap.hidden = true;
      fl.innerHTML = "";
    }
  }

  async function load() {
    readUI();
    save();
    const ch = state.channel;
    $("ch-label").textContent = ({
      my_origin: "仅明确匹配你的机场",
      china_mainland: "中国内地出发",
      hk_mo: "HKG / MFM",
      global_error: "全球 Bug Fare / Fuel Dump",
    })[ch] || ch;
    $("origin-panel").hidden = ch === "global_error";
    const q = new URLSearchParams();
    q.set("channel", ch);
    q.set("limit", "40");
    // D-004：全球错价默认不带用户偏好机场
    if (ch !== "global_error") {
      if (state.codes && state.codes.length) q.set("origins", state.codes.join(","));
      if (state.nationwide) q.set("mode", "china_all");
      if (state.hkg) q.set("include_hkg", "1");
      if (state.mfm) q.set("include_mfm", "1");
    }
    q.set("hide_expired", state.hide_expired ? "1" : "0");
    if (state.dest) q.set("destination", state.dest);
    if (state.cat) q.set("category", state.cat);
    if (state.date_from) q.set("date_from", state.date_from);
    if (state.date_to) q.set("date_to", state.date_to);
    if (state.fb) q.set("feedback", state.fb);
    $("origin-status").textContent = "加载中…";
    try {
      const r = await fetch("/api/v1/fare/intel?" + q.toString(), { credentials: "same-origin" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      render(data.data);
      $("origin-status").textContent = "已更新 · channel=" + (data.data && data.data.channel);
    } catch (e) {
      $("origin-status").textContent = "失败：" + e.message;
    }
  }

  document.querySelectorAll(".tab").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      state.channel = btn.getAttribute("data-ch");
      load();
    });
  });
  // init active tab
  document.querySelectorAll(".tab").forEach((b) => {
    if (b.getAttribute("data-ch") === state.channel) {
      document.querySelectorAll(".tab").forEach((x) => x.classList.remove("active"));
      b.classList.add("active");
    }
  });
  $("btn-apply").addEventListener("click", load);
  $("btn-reset").addEventListener("click", () => {
    state.codes = ["CKG","TFU","CTU"];
    state.nationwide = false; state.hkg = false; state.mfm = false;
    state.dest = ""; state.cat = ""; state.date_from = ""; state.date_to = ""; state.fb = "";
    if ($("f-dest")) $("f-dest").value = "";
    if ($("f-cat")) $("f-cat").value = "";
    if ($("f-from")) $("f-from").value = "";
    if ($("f-to")) $("f-to").value = "";
    if ($("f-fb")) $("f-fb").value = "";
    renderChips();
    load();
  });
  document.getElementById("intel-list").addEventListener("click", async (e) => {
    const btn = e.target.closest("button.fb");
    if (!btn) return;
    try {
      const r = await fetch("/api/v1/fare/intel/" + btn.getAttribute("data-id") +
        "/feedback?feedback=" + encodeURIComponent(btn.getAttribute("data-fb")),
        { method: "POST", credentials: "same-origin" });
      if (r.ok) { btn.textContent = "✓"; btn.disabled = true; }
    } catch (err) {}
  });

  renderChips();
  load();
})();
</script>
{% endblock %}
