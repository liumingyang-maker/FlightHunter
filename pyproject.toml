[project]
name = "flighthunter"
version = "1.0.0"
description = "FlightHunter V1.0 R3 — 个人全球旅行机会平台（抽奖 / 行程福利 / 机票雷达）"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "FlightHunter" }]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.3",
    "selectolax>=0.3.27",
    "typer>=0.14.0",
    "rich>=13.9.0",
    "playwright>=1.48.0",
    "tzdata>=2024.2",
    "python-dateutil>=2.9.0",
    "itsdangerous>=2.2.0",
    "greenlet>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-pyyaml",
    "types-beautifulsoup4",
    "httpx>=0.27.0",
    "asgi-lifespan>=2.1.0",
]

[project.scripts]
flighthunter = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
extend-exclude = [
    "_audit_round2_tmp",
    "_audit_round3_tmp",
    "_audit_round4_tmp",
    "_audit_round5_tmp",
    "_audit_round6_tmp",
    "_audit_round7_tmp",
    "_audit_round8_tmp",
    "_audit_round9_tmp",
    "_audit_round10_tmp",
    "_audit_round11_tmp",
    "_audit_tool_tmp",
    "review_exports",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    "N818",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF012",
    "RUF059",
    "SIM102",
    "SIM105",
    "SIM108",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "app/alembic/versions/"]

[[tool.mypy.overrides]]
module = "app.models.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: 集成测试",
    "e2e: 端到端测试",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/alembic/*", "app/web/static/*"]






